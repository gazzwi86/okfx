name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync
      # The OKF reference implementation, for the conformance tests. --no-deps:
      # its loader needs only PyYAML, not google-adk.
      - run: >
          uv pip install --no-deps
          "reference-agent @ git+https://github.com/GoogleCloudPlatform/knowledge-catalog@8cf3abaf1ee3d53a12f981cc0ed83d6ffec775e1#subdirectory=okf"
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      # Nothing in pytest parses the viewer's page script, so syntax is checked
      # here. node is preinstalled on ubuntu-latest.
      - run: node --check src/okfx/static/graph.js
      - env:
          OKFX_REQUIRE_REFERENCE: "1"
        run: uv run pytest -q
      - run: uv run okfx check examples/acme --allow-validators
      - run: uv run okfx graph examples/acme -o /tmp/graph.html
      # The viewer's assets are data files, so no import error catches their
      # absence: a wheel missing them installs fine and fails at first use. A
      # .gitignore pattern shipped exactly that once, hence this check.
      - run: uv build --wheel
      - name: the wheel carries the viewer's assets
        run: |
          uv run python - <<'EOF'
          import glob, sys, zipfile
          wheel = sorted(glob.glob("dist/*.whl"))[-1]
          names = set(zipfile.ZipFile(wheel).namelist())
          want = {
              "okfx/templates/graph.html",
              "okfx/static/graph.css",
              "okfx/static/graph.js",
              "okfx/static/vendor/cytoscape.min.js",
              "okfx/static/vendor/marked.min.js",
              "okfx/static/vendor/cytoscape.LICENSE.txt",
              "okfx/static/vendor/marked.LICENSE.txt",
          }
          missing = sorted(want - names)
          if missing:
              sys.exit(f"{wheel} is missing: {', '.join(missing)}")
          print(f"{wheel}: all viewer assets present")
          EOF
      - name: the installed wheel actually runs
        run: uvx --from "$(ls dist/*.whl)" okfx graph examples/acme -o /tmp/installed.html
